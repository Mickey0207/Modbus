directories:
  output: dist
  buildResources: build
appId: com.modbus.tcp.tool
productName: Modbus TCP 工具
files:
  - filter:
      - main.js
      - server/**/*
      - fronted/dist/**/*
      - public/**/*
      - node_modules/**/*
      - package.json
extraResources:
  - from: server/data
    to: server/data
    filter:
      - '**/*'
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target: nsis
  icon: assets/icon.ico
mac:
  target: dmg
  icon: assets/icon.icns
linux:
  target: AppImage
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
electronVersion: 38.1.2
